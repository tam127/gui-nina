<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Art - Món Quà Bí Mật</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1f1a24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", Courier, monospace;
      color: #ffeaf2;
      gap: 16px;
    }
    .frame {
      position: relative;
      padding: 12px;
      background: #33293d;
      border: 4px solid #f7b7cd;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 512px;
      height: 512px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #fff6f8;
    }
    .greeting-box {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 82%;
      text-align: center;
      padding: 10px 14px;
      background: rgba(255, 245, 247, 0.95);
      border: 3px solid #d62839;
      box-shadow: 0 4px 0 #8a1522;
      color: #8a1522;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .greeting-box.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .dev-credit {
      position: absolute;
      right: 20px;
      bottom: 18px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #9e7382;
      pointer-events: none;
      user-select: none;
    }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      padding: 8px 18px;
      background: #ff9eb5;
      color: #2b1a23;
      border: 3px solid #ffeaf2;
      cursor: pointer;
    }
    button:hover { background: #ffb7c9; }
    @media (max-width: 560px) {
      canvas { width: 340px; height: 340px; }
      .greeting-box { font-size: 14px; padding: 7px 10px; }
      .dev-credit { font-size: 9px; right: 18px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="scene" width="128" height="128"></canvas>
    <div id="greeting" class="greeting-box">Fuck you idiot</div>
    <div class="dev-credit">DEV: Anh Nguyen</div>
  </div>
  <button id="replayBtn">Phát lại</button>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const greetingEl = document.getElementById("greeting");
    ctx.imageSmoothingEnabled = false;

    const W = 128;
    const H = 128;

    const CAT_PALETTE = {
      o: "#6e4427", O: "#e89e54", d: "#c4722f", l: "#f7cfa3",
      w: "#fffaf2", p: "#f29ca8", P: "#d47282", b: "#1a1114", h: "#ffffff"
    };

    const GIFT_PALETTE = {
      o: "#4a0810", D: "#7d0e1a", d: "#a81826",
      R: "#d92130", r: "#ff4757", h: "#ff9aa2", W: "#ffffff"
    };

    const CAT_BACK_1 = [
      "....oo............oo....","...oOOo..........oOOo...","...oOdo..........odOo...",
      "..oOOdOo..oooo..oOdOOo..","..oOOOOoooOddOoooOOOOo..","..oOOOOOOOdOOdOOOOOOOo..",
      "..oOdOOOOOdOOdOOOOOdOo..","...oOOOOOOdOOdOOOOOOo...","...oOdOOOOOOOOOOOOdOo...",
      "...oOOOOOOOOOOOOOOOOo...","....oOOOOOOOOOOOOOOo....",".....ooOOOOOOOOOOoo.....",
      "......oOOdOOOOdOOo......",".....oOOOOdOOdOOOOo.....",".....oOdOOOOOOOOdOo.....",
      ".....oOOOOOOOOOOOOo.....","....oOOdOOOOOOOOdOOo....","....oOOOOOOOOOOOOOOo....",
      "....oOOdOOOOOOOOdOOo....","....oOOOOOOOOOOOOOOo....","....oOOOOOOOOOOOOOOo..oo",
      ".....oOOdOOOOOOdOOo..oOo",".....oOOOOOOOOOOOOo.oOdo",".....oOOOOOOOOOOOOooOOo.",
      "......oOOOo..oOOOOOOoo..","......oOOOo..oOOOo......","......owwwo..owwwo......",
      ".......ooo....ooo......."
    ];

    const CAT_BACK_2 = [
      "....oo............oo....","...oOOo..........oOOo...","...oOdo..........odOo...",
      "..oOOdOo..oooo..oOdOOo..","..oOOOOoooOddOoooOOOOo..","..oOOOOOOOdOOdOOOOOOOo..",
      "..oOdOOOOOdOOdOOOOOdOo..","...oOOOOOOdOOdOOOOOOo...","...oOdOOOOOOOOOOOOdOo...",
      "...oOOOOOOOOOOOOOOOOo...","....oOOOOOOOOOOOOOOo....",".....ooOOOOOOOOOOoo.....",
      "......oOOdOOOOdOOo......",".....oOOOOdOOdOOOOo.....",".....oOdOOOOOOOOdOo.....",
      ".....oOOOOOOOOOOOOo.....","....oOOdOOOOOOOOdOOo....","....oOOOOOOOOOOOOOOo....",
      "....oOOdOOOOOOOOdOOo....","....oOOOOOOOOOOOOOOo....","oo..oOOOOOOOOOOOOOOo....",
      "oOo..oOOdOOOOOOdOOo.....","odOo.oOOOOOOOOOOOOo.....",".oOOooOOOOOOOOOOOOo.....",
      "..ooOOOOOOo..oOOOo......","......oOOOo..oOOOo......","......owwwo..owwwo......",
      ".......ooo....ooo......."
    ];

    const CAT_TURN = [
      ".....oo.........oo......","....oOOo.......oOpo.....","....oOdo......oOpPo.....",
      "...oOOdOo.ooooOOpPo.....","...oOOOOooOddOOOOOo.....","...oOOOOOOdOOdOOOOOo....",
      "...oOdOOOOdOOdOOOOOo....","....oOOOOOdOOdOllOOo....","....oOdOOOOOOOOllllo....",
      "....oOOOOOOOOOllbbho....","....oOOOOOOOOOllbbbo....",".....oOOOOOOOlllbbo.....",
      "......oOOOOOOllwwpo.....",".....oOOdOOOOlwwww......",".....oOOOOOOOllwwwo.....",
      ".....oOdOOOOOllwwwo.....","....oOOOOOOOOlwwwOo.....","....oOOdOOOOOlwwwOo.....",
      "....oOOOOOOOOllwwOo.....","....oOOdOOOOOllwwOo.....",".oo.oOOOOOOOOlwwwOo.....",
      "oOo..oOOdOOOOlwwwOo.....","odOo.oOOOOOOOlwwwOo.....",".oOOooOOOOOOOOllwOo.....",
      "..ooOOOOOo...oOOOo......",".....oOOOo...oOOOo......",".....owwwo...owwwo......",
      "......ooo.....ooo......."
    ];

    const CAT_FRONT = [
      "...oo..............oo...","..oOpo............opOo..","..oOpPo..........oPpOo..",
      ".oOOpPPo..oooo..oPPpOOo.",".oOOppPOooOddOooOPppOOo.",".oOOOOOOOdOOOOdOOOOOOOo.",
      ".oOdOOOOOdOllOdOOOOOdOo.","..oOOOOOOllOOllOOOOOOo..","..oOdlllllllllllllldOo..",
      "..oOllbbbhllllbbbhllOo..","..oOllbbbbllllbbbbllOo..","..oOllbbbhllllbbbhllOo..",
      "..oOlllbbllllllbblllOo..","...oOllllwwppwwllllOo...","...oOlllwwwwwwwwlllOo...",
      "....oOllwwwwwwwwllOo....",".....ooOllwwwwllOoo.....",".....oOOllwwwwllOOo.....",
      "....oOdlllwwwwllldOo....","....oOOlllwwwwlllOOo....","....oOdlllwwwwllldOo....",
      "....oOOlllwwwwlllOOo....","....oOOlllwwwwlllOOo....",".....oOOllwwwwllOOo.....",
      ".....oOOOo....oOOOo.....",".....oOOOo....oOOOo.....",".....owwwo....owwwo.....",
      "......ooo......ooo......"
    ];

    const CAT_SMUG = [
      "...oo..............oo...","..oOpo............opOo..","..oOpPo..........oPpOo..",
      ".oOOpPPo..oooo..oPPpOOo.",".oOOppPOooOddOooOPppOOo.",".oOOOOOOOdOOOOdOOOOOOOo.",
      ".oOdOOOOOdOllOdOOOOOdOo.","..oOOOOOOllOOllOOOOOOo..","..oOdlllllllllllllldOo..",
      "..oOllooooollooooollOo..","..oOllbbbhllllbbbhllOo..","..oOllbbbbllllbbbbllOo..",
      "..oOlllbbllllllbblllOo..","...oOllllwwppwwllllOo...","...oOlllwwwwwwwwlllOo...",
      "....oOllwwwwwwwwllOo....",".....ooOllwwwwllOoo.....",".....oOOllwwwwllOOo.....",
      "....oOdlllwwwwllldOo....","....oOOlllwwwwlllOOo....","....oOdlllwwwwllldOo....",
      "....oOOlllwwwwlllOOo....","....oOOlllwwwwlllOOo....",".....oOOllwwwwllOOo.....",
      ".....oOOOo....oOOOo.....",".....oOOOo....oOOOo.....",".....owwwo....owwwo.....",
      "......ooo......ooo......"
    ];

    const GIFT_LID = [
      "......ooo...ooo......",".....orhrororhr......",".....orrrrrorrro.....",
      "....oorrrhrhrrroo....",".ooooooooooooooooooo.","oDDDDDDDDrrrDDDDDDDDo",
      "oDddddddDrrrDddddddDo","oDDDDDDDDrrrDDDDDDDDo",".ooooooooooooooooooo."
    ];

    const GIFT_BASE = [
      "..oRRRRRRrrrRRRRRRo..","..oRWWWRRrrrRRWWWRo..","..oRRRRWRrrrRRRRWRo..",
      "..oRRWRRRrrrRRWRRRo..","..oRRRRRRrrrRRRRRRo..","..oRRWRRRrrrRRWRRRo..",
      "..oRRRRRRrrrRRRRRRo..","..oRWWWRRrrrRRWWWRo..","..oRRRRWRrrrRRRRWRo..",
      "..oRRWRRRrrrRRWRRRo..","..oRRRRRRrrrRRRRRRo..","..oRRWRRRrrrRRWRRRo..",
      "..ooooooooooooooooo.."
    ];

    const MIDDLE_FINGER = [
      ".....ooo.....","....owwwo....","....owwwo....","....owwwo....",
      "....owwwo....","....owwwo....","....owwwo....","..ooowwwooo..",
      ".owwowwwowwo.",".owwowwwowwo.","oOwwowwwowwOo","oOOwwwwwwwOOo",
      "oOOlwwwwwlOOo",".oOOlllllOOo.","..oOOOOOOOo..","...oOOOOOo...",
      "....ooooo...."
    ];

    function drawSprite(sprite, palette, x, y, scale) {
      const sx = Math.round(x);
      const sy = Math.round(y);
      for (let r = 0; r < sprite.length; r++) {
        const line = sprite[r];
        for (let c = 0; c < line.length; c++) {
          const ch = line[c];
          if (ch !== "." && palette[ch]) {
            ctx.fillStyle = palette[ch];
            ctx.fillRect(sx + c * scale, sy + r * scale, scale, scale);
          }
        }
      }
    }

    const petalColors = ["#ff9eb5", "#ffb7c5", "#ffc8d6", "#ff85a2"];
    let petals = [];

    function createPetal(startY) {
      return {
        x: Math.random() * W,
        y: startY,
        vx: -0.15 + Math.random() * 0.3,
        vy: 0.25 + Math.random() * 0.35,
        swayAmp: 0.2 + Math.random() * 0.35,
        swaySpeed: 0.03 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
        size: Math.random() > 0.5 ? 2 : 1,
        color: petalColors[Math.floor(Math.random() * petalColors.length)],
        landed: false,
        landY: 96 + Math.random() * 24
      };
    }

    function initPetals() {
      petals = [];
      for (let i = 0; i < 14; i++) petals.push(createPetal(-Math.random() * 70));
    }

    function updateAndDrawPetals(time) {
      if (petals.length < 30 && Math.random() < 0.06) petals.push(createPetal(-4));
      for (const p of petals) {
        if (!p.landed) {
          p.y += p.vy;
          p.x += p.vx + Math.sin(time * p.swaySpeed + p.phase) * p.swayAmp;
          if (p.y >= p.landY) p.landed = true;
          if (p.x < -4) p.x = W + 2;
          if (p.x > W + 4) p.x = -2;
        }
        const px = Math.round(p.x);
        const py = Math.round(p.y);
        ctx.fillStyle = p.color;
        ctx.fillRect(px, py, 2, 1);
        ctx.fillRect(px + 1, py + 1, 2, 1);
        if (p.size === 2) {
          ctx.fillStyle = "#ffe6ee";
          ctx.fillRect(px + 1, py, 1, 1);
        }
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#fff5f7";
      ctx.fillRect(0, 0, W, 88);
      ctx.fillStyle = "#ffebf0";
      ctx.fillRect(0, 74, W, 14);
      ctx.fillStyle = "#f2d5de";
      ctx.fillRect(0, 88, W, 2);
      ctx.fillStyle = "#fdf2e9";
      ctx.fillRect(0, 90, W, H - 90);
      ctx.fillStyle = "#f5e4d7";
      for (let y = 96; y < H; y += 10) ctx.fillRect(0, y, W, 1);
      ctx.fillStyle = "#e8d3c5";
      ctx.fillRect(46, 102, 36, 4);
      ctx.fillRect(49, 101, 30, 6);
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    let startTime = null;
    let frameCount = 0;

    function render(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;
      frameCount++;

      // Zoom từ từ trong 4 giây (3.2s -> 7.2s)
      let zoom = 1;
      if (elapsed >= 3.2 && elapsed < 7.2) {
        const zProgress = Math.min((elapsed - 3.2) / 4.0, 1);
        zoom = 1 + easeInOutQuad(zProgress) * 1.35;
      }

      ctx.save();
      if (zoom > 1) {
        ctx.translate(W / 2, H / 2);
        ctx.scale(zoom, zoom);
        ctx.translate(-64, -86);
      }

      drawBackground();

      const catScale = 2;
      const catX = Math.floor((W - 24 * catScale) / 2);
      const catY = 48;

      if (elapsed < 2.2) {
        const wag = Math.floor(elapsed * 3.5) % 2 === 0;
        drawSprite(wag ? CAT_BACK_1 : CAT_BACK_2, CAT_PALETTE, catX, catY, catScale);
      } else if (elapsed < 3.2) {
        drawSprite(elapsed < 2.75 ? CAT_TURN : CAT_FRONT, CAT_PALETTE, catX, catY, catScale);
      } else if (elapsed < 7.2) {
        drawSprite(CAT_FRONT, CAT_PALETTE, catX, catY, catScale);

        // Hộp quà mở từ từ theo nhịp zoom (4 giây)
        const openProgress = Math.min((elapsed - 3.2) / 3.8, 1);
        const shakeX = openProgress < 0.85 ? Math.round(Math.sin(elapsed * 26) * 0.6) : 0;
        const boxX = 53 + shakeX;
        const boxY = 82;

        drawSprite(GIFT_BASE, GIFT_PALETTE, boxX, boxY, 1);

        if (openProgress > 0.3) {
          const glowAlpha = Math.min((openProgress - 0.3) / 0.7, 1);
          ctx.fillStyle = "rgba(255, 252, 210, " + glowAlpha + ")";
          ctx.fillRect(boxX + 2, boxY - Math.round(openProgress * 8), 17, Math.round(openProgress * 9) + 2);
        }

        const lidLift = Math.round(easeInOutQuad(openProgress) * 11);
        const lidShiftX = Math.round(easeInOutQuad(openProgress) * 3);
        drawSprite(GIFT_LID, GIFT_PALETTE, boxX + lidShiftX, boxY - 8 - lidLift, 1);

        ctx.fillStyle = CAT_PALETTE.o;
        ctx.fillRect(boxX - 2, boxY + 5, 5, 5);
        ctx.fillRect(boxX + 18, boxY + 5, 5, 5);
        ctx.fillStyle = CAT_PALETTE.w;
        ctx.fillRect(boxX - 1, boxY + 6, 3, 3);
        ctx.fillRect(boxX + 19, boxY + 6, 3, 3);
      } else {
        const revealBob = Math.round(Math.sin(elapsed * 4) * 0.8);
        drawSprite(CAT_SMUG, CAT_PALETTE, catX, catY + revealBob, catScale);

        // Giơ tay lệch sang bên trái để nhìn rõ ngón tay giữa trên nền sáng
        const handScale = 2;
        const handX = 22;
        const handY = 68 + revealBob;
        drawSprite(MIDDLE_FINGER, CAT_PALETTE, handX, handY, handScale);

        if (elapsed > 7.45) greetingEl.classList.add("show");
      }

      updateAndDrawPetals(frameCount);
      ctx.restore();

      // Lóe sáng trắng chuyển cảnh (6.75s -> 7.8s)
      if (elapsed >= 6.75 && elapsed <= 7.8) {
        let flashAlpha = elapsed < 7.2
          ? (elapsed - 6.75) / 0.45
          : 1 - (elapsed - 7.2) / 0.6;
        flashAlpha = Math.max(0, Math.min(1, flashAlpha));
        ctx.fillStyle = "rgba(255, 255, 255, " + flashAlpha + ")";
        ctx.fillRect(0, 0, W, H);
      }

      requestAnimationFrame(render);
    }

    function restartAnimation() {
      startTime = null;
      frameCount = 0;
      greetingEl.classList.remove("show");
      initPetals();
    }

    document.getElementById("replayBtn").addEventListener("click", restartAnimation);
    canvas.addEventListener("click", restartAnimation);

    initPetals();
    requestAnimationFrame(render);
  </script>
</body>
</html>
